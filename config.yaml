# NAS100 Trade Trainer settings. Change values here, not in code.

symbol: NAS100.s            # broker symbol name in MT5 (PU Prime: "NAS100 Cash")
file_prefix: nas100         # data/<prefix>_<tf>.parquet
history_months: 12          # M1 history to pull on the first run

# How broker server time relates to real time.
#   ny_plus_7: server clock = New York time + 7h (GMT+2 winter / GMT+3 summer,
#              switching on US DST dates). PU Prime, IC Markets, Pepperstone, FTMO.
#   fixed:     server clock = UTC + fixed_offset_hours all year.
server_time:
  mode: ny_plus_7
  fixed_offset_hours: 2

session:
  tz: America/New_York
  start: "08:00"            # practice window start
  end: "10:00"              # practice window end
  timeout: "17:00"          # trades still open are closed here (end of the futures day)

gap_alert_minutes: 5        # flag missing M1 data longer than this inside start..timeout
spread_points: 1.5          # added on entry

data_dir: data
timeframes: [M5, M15, H1, H4]

# ---------- Phase 2: scenario detection (all times New York) ----------
levels:
  asian: ["20:00", "00:00"]   # previous evening
  london: ["02:00", "05:00"]
  day_start: "18:00"          # futures day runs 18:00 -> 17:00 NY; previous day = the one before

detectors:
  atr_period: 14
  swing_bars: 2               # fractal swing: N bars lower/higher on each side
  sweep_reclaim_bars: 3       # wick beyond, close back inside within N bars
  displacement_atr: 1.5       # body > X * ATR
  opening_range: ["09:30", "09:45"]
  fvg_min_atr: 0.1            # ignore gaps smaller than X * ATR
  priority: [sweep, fvg_retest, bos, orb]   # label when several fire on one bar

controls:
  share: 0.25                 # no-trade share of all scenarios (keep 0.20-0.30)
  cooldown_bars: 3            # bar must have no detection in itself and the previous N bars
  seed: 7

outcome:
  horizon_bars: 120           # hidden MFE/MAE horizon in M5 bars
  stop_atr: 1.0               # default stop for R and skip grading
  target_r: 3.0               # big move: skip is correct if neither side hits +3R before -1R

h1_trend:
  fast_ema: 20
  slow_ema: 50
  flat_atr: 0.1               # |fast - slow| < X * H1 ATR -> flat

scenarios_file: scenarios.parquet

# ---------- Phase 3: practice app ----------
practice:
  session_rounds: 10
  no_trade_share: 0.25        # share of no-trade rounds in a mixed session
  min_rr: 3.0                 # plan check: R:R >= this (big moves)
  history_days:               # chart history shown at the freeze bar, per timeframe
    M5: 2
    M15: 5
    H1: 15
  fake_date: "2000-01-03"     # charts are shifted to this date so the real date stays hidden
  log_file: logs/trades.csv

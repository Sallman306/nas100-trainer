<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAS100 Trade Trainer</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="xp.css">
</head>
<body>
<div id="window">
  <!-- Luna title bar -->
  <div class="titlebar">
    <span class="app-icon">📈</span>
    <span class="title" data-l="title"></span>
    <span id="roundInfo" class="title-sub"></span>
    <span class="spacer"></span>
    <span class="tb-btn">_</span><span class="tb-btn">□</span><span class="tb-btn close">✕</span>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <span class="tool-label" data-l="timeframe"></span>
    <button class="xp-btn" data-tf="M5">M5 <kbd>1</kbd></button>
    <button class="xp-btn" data-tf="M15">M15 <kbd>2</kbd></button>
    <button class="xp-btn" data-tf="H1">H1 <kbd>3</kbd></button>
    <span class="sep"></span>
    <span class="tool-label" data-l="speed"></span>
    <button class="xp-btn" data-speed="1">1x <kbd>Z</kbd></button>
    <button class="xp-btn" data-speed="5">5x <kbd>X</kbd></button>
    <button class="xp-btn" data-speed="0"><span data-l="instant"></span> <kbd>C</kbd></button>
    <span class="spacer"></span>
    <span id="phaseInfo" class="tool-label"></span>
    <span class="sep"></span>
    <button class="xp-btn" id="btnTheme"></button>
  </div>

  <div id="main">
    <div id="chartFrame">
      <div id="chart">
        <div id="zoneReward" class="zone reward" hidden></div>
        <div id="zoneRisk" class="zone risk" hidden></div>
      </div>
    </div>

    <aside id="side">
      <!-- decision panel -->
      <div id="decidePanel" class="panel">
        <fieldset class="group">
          <legend data-l="decision"></legend>
          <div class="decide-row">
            <button id="btnLong" class="xp-btn big long"><span data-l="long"></span><kbd>L</kbd></button>
            <button id="btnShort" class="xp-btn big short"><span data-l="short"></span><kbd>S</kbd></button>
            <button id="btnSkip" class="xp-btn big skip"><span data-l="skip"></span><kbd>K</kbd></button>
          </div>
          <div id="decisionHint" class="hint"></div>
        </fieldset>

        <fieldset class="group grow" id="orderBox">
          <legend data-l="order"></legend>
          <div class="order-grid">
            <label class="lab entry" data-l="entry"></label>
            <div class="inline"><input id="inEntry" type="number" step="0.25"><button id="btnMarket" class="xp-btn small"><span data-l="market"></span> <kbd>M</kbd></button></div>
            <label class="lab sl" data-l="sl"></label><input id="inSl" type="number" step="0.25">
            <label class="lab tp" data-l="tp"></label><input id="inTp" type="number" step="0.25">
          </div>
          <div class="readout">
            <div><span class="caption" data-l="rr"></span><b id="rrOut">–</b></div>
            <div><span class="caption" data-l="risk"></span><b id="riskOut">–</b><span class="unit" data-l="points"></span></div>
            <div><span class="caption" data-l="reward"></span><b id="rewardOut">–</b><span class="unit" data-l="points"></span></div>
          </div>
          <div id="orderType" class="hint"></div>
          <div id="noOrder" class="hint center" data-l="no_order"></div>
        </fieldset>

        <fieldset class="group grow">
          <legend data-l="tags"></legend>
          <div class="tag-grid">
            <label data-l="setup"></label><select id="selSetup"></select>
            <label data-l="bias"></label><select id="selBias"></select>
            <label data-l="confidence"></label><div class="conf-row" id="confRow"></div>
            <label data-l="note"></label><input id="inNote" type="text" maxlength="300">
          </div>
        </fieldset>

        <fieldset class="group">
          <legend data-l="commit_box"></legend>
          <button id="btnCommit" class="xp-btn go"><span data-l="commit"></span> <kbd>Enter</kbd></button>
          <div id="msg" class="msg"></div>
        </fieldset>
      </div>

      <!-- result panel (filled by app.js) -->
      <div id="resultPanel" class="panel" hidden>
        <div id="resultBody" class="result-scroll"></div>
        <button id="btnNext" class="xp-btn go"></button>
      </div>
    </aside>
  </div>

  <!-- status bar -->
  <div class="statusbar">
    <span class="pane grow" data-l="help"></span>
    <span class="pane" id="clockFreeze"></span>
    <span class="pane" id="clockCursor"></span>
  </div>
</div>

<!-- start / report dialog -->
<div id="overlay">
  <div class="dialog">
    <div class="titlebar small"><span class="app-icon">📈</span><span class="title" id="dialogTitle" data-l="start_title"></span>
      <span class="spacer"></span><span class="tb-btn close">✕</span></div>
    <div class="dialog-body" id="overlayBox">
      <fieldset class="group">
        <legend data-l="start_title"></legend>
        <div class="tag-grid">
          <label data-l="drill"></label><select id="selDrill"></select>
          <label data-l="rounds"></label><input id="inRounds" type="number" min="1" max="50">
        </div>
      </fieldset>
      <button id="btnStart" class="xp-btn go"><span data-l="start"></span> <kbd>Enter</kbd></button>
      <button id="btnProgress" class="xp-btn"><span data-l="progress"></span> <kbd>P</kbd></button>
      <div id="startMsg" class="msg"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="report.js"></script>
</body>
</html>
